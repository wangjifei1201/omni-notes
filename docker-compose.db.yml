version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: omni-notes-postgres
    environment:
      POSTGRES_USER: omni_notes
      POSTGRES_PASSWORD: omni_notes_123
      POSTGRES_DB: omni_notes
    ports:
      - "5432:5432"
    volumes:
      - ./postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni_notes"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
