version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: omni-notes-db
    environment:
      POSTGRES_USER: omni_notes
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-omni_notes_pass}
      POSTGRES_DB: omni_notes
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omni_notes"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: omni-notes-backend
    environment:
      DEBUG: "false"
      APP_NAME: "Omni-Notes API"
      DATABASE_URL: postgresql+asyncpg://omni_notes:${POSTGRES_PASSWORD:-omni_notes_pass}@postgres:5432/omni_notes
      COOKIE_ENCRYPTION_KEY: ${COOKIE_ENCRYPTION_KEY:-your-secret-key-must-be-32-bytes}
      SESSION_EXPIRE_DAYS: "7"
      CORS_ORIGINS: "http://localhost:3000"
      AI_PROVIDER: ${AI_PROVIDER:-bailian}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-qwen-max}
      USE_WHISPER: "true"
      WHISPER_MODEL: ${WHISPER_MODEL:-base}
      PROXY_ENABLED: "false"
      MAX_CONCURRENT_TASKS: "2"
      MAX_QUEUE_SIZE: "10"
      GUEST_USAGE_LIMIT: "10"
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - backend_temp:/app/temp
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: omni-notes-frontend
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:8000}
    ports:
      - "3000:3000"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  postgres_data:
  backend_temp:
