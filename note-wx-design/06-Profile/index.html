<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Omni-Notes 我的页面原型</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 32px; }
    h1 { font-size: 24px; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #8b8b9e; }
    .preview-grid { display: flex; justify-content: center; gap: 32px; flex-wrap: wrap; }
    .phone-frame {
      width: 300px;
      height: 580px;
      background: #1a1a2e;
      border-radius: 40px;
      padding: 10px;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.25);
    }
    .phone-screen {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 30px;
      overflow: hidden;
      position: relative;
    }
    .phone-notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 24px;
      background: #1a1a2e;
      border-radius: 0 0 16px 16px;
      z-index: 100;
    }
    .screen-content {
      width: 100%;
      height: 100%;
      padding: 50px 16px 70px;
      display: flex;
      flex-direction: column;
      background: #f8f9fc;
    }
    /* 顶部导航 */
    .nav-header {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px 0 16px;
      margin-bottom: 16px;
    }
    .page-title { font-size: 18px; font-weight: 600; color: #1a1a2e; }
    /* 内容区 */
    .content-area { flex: 1; overflow-y: auto; }
    /* 用户信息卡片 */
    .user-card {
      background: #ffffff;
      border-radius: 20px;
      padding: 24px;
      margin-bottom: 20px;
      box-shadow: 0 4px 16px rgba(0,0,0,0.06);
    }
    .user-main { display: flex; align-items: center; gap: 16px; margin-bottom: 20px; }
    .avatar {
      width: 60px;
      height: 60px;
      border-radius: 50%;
      background: linear-gradient(135deg, #7c3aed 0%, #a855f7 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      font-weight: 700;
      color: white;
    }
    .user-info { display: flex; flex-direction: column; gap: 4px; }
    .user-name { font-size: 20px; font-weight: 600; color: #1a1a2e; }
    .user-badge {
      font-size: 12px;
      color: #7c3aed;
      background: rgba(124, 58, 237, 0.1);
      padding: 4px 10px;
      border-radius: 8px;
      display: inline-block;
      width: fit-content;
    }
    /* 用户统计 */
    .user-stats {
      display: flex;
      align-items: center;
      justify-content: space-around;
      padding-top: 16px;
      border-top: 1px solid rgba(0, 0, 0, 0.05);
    }
    .stat-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .stat-num { font-size: 24px; font-weight: 700; color: #7c3aed; }
    .stat-label { font-size: 12px; color: #8b8b9e; }
    .stat-divider { width: 1px; height: 40px; background: rgba(0, 0, 0, 0.05); }
    /* 关于与帮助 */
    .section-card {
      background: #ffffff;
      border-radius: 16px;
      overflow: hidden;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.04);
    }
    .menu-list { display: flex; flex-direction: column; }
    .menu-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      cursor: pointer;
    }
    .menu-item:active { background: #f5f6fa; }
    .menu-item:not(:last-child) { border-bottom: 1px solid rgba(0, 0, 0, 0.05); }
    .item-left { display: flex; align-items: center; gap: 14px; }
    .item-icon {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: rgba(124, 58, 237, 0.1);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 14px;
      color: #7c3aed;
      font-weight: 600;
    }
    .item-info { display: flex; flex-direction: column; gap: 2px; }
    .item-title { font-size: 15px; font-weight: 500; color: #1a1a2e; }
    .item-desc { font-size: 12px; color: #8b8b9e; }
    .arrow { font-size: 18px; color: #c0c0d0; }
    /* 底部留白 */
    .bottom-spacer { height: 20px; }
    /* TabBar */
    .tab-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: #ffffff; border-top: 1px solid #f0f0f5; display: flex; }
    .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
    .tab-icon { font-size: 20px; color: #8b8b9e; }
    .tab-label { font-size: 10px; color: #8b8b9e; }
    .tab-item.active .tab-icon, .tab-item.active .tab-label { color: #7c3aed; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>我的页面原型</h1>
      <p class="subtitle">参考实际小程序实现</p>
    </header>

    <div class="preview-grid">
      <div class="screenshot-item">
        <div class="phone-frame">
          <div class="phone-screen">
            <div class="phone-notch"></div>
            <div class="screen-content">
              <!-- 顶部导航 -->
              <div class="nav-header">
                <span class="page-title">我的</span>
              </div>

              <div class="content-area">
                <!-- 用户信息卡片 -->
                <div class="user-card">
                  <div class="user-main">
                    <div class="avatar">O</div>
                    <div class="user-info">
                      <div class="user-name">游客用户</div>
                      <div class="user-badge">普通用户</div>
                    </div>
                  </div>
                  <!-- 用户统计 -->
                  <div class="user-stats">
                    <div class="stat-item">
                      <span class="stat-num">0</span>
                      <span class="stat-label">分析次数</span>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-item">
                      <span class="stat-num">0</span>
                      <span class="stat-label">收藏</span>
                    </div>
                    <div class="stat-divider"></div>
                    <div class="stat-item">
                      <span class="stat-num">0</span>
                      <span class="stat-label">使用天数</span>
                    </div>
                  </div>
                </div>

                <!-- 关于与帮助 -->
                <div class="section-card">
                  <div class="menu-list">
                    <div class="menu-item">
                      <div class="item-left">
                        <div class="item-icon">?</div>
                        <div class="item-info">
                          <div class="item-title">使用帮助</div>
                        </div>
                      </div>
                      <span class="arrow">›</span>
                    </div>
                    <div class="menu-item">
                      <div class="item-left">
                        <div class="item-icon">i</div>
                        <div class="item-info">
                          <div class="item-title">关于 Omni-Notes</div>
                          <div class="item-desc">v2.0.0</div>
                        </div>
                      </div>
                      <span class="arrow">›</span>
                    </div>
                  </div>
                </div>

                <!-- 底部留白 -->
                <div class="bottom-spacer"></div>
              </div>

              <!-- TabBar -->
              <div class="tab-bar">
                <div class="tab-item">
                  <span class="tab-icon">◈</span>
                  <span class="tab-label">首页</span>
                </div>
                <div class="tab-item">
                  <span class="tab-icon">◊</span>
                  <span class="tab-label">历史</span>
                </div>
                <div class="tab-item active">
                  <span class="tab-icon">◯</span>
                  <span class="tab-label">我的</span>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div style="text-align: center; margin-top: 12px; font-size: 13px; color: #6b7280;">我的页面</div>
      </div>
    </div>
  </div>
</body>
</html>
