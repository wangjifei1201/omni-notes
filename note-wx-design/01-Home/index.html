<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Omni-Notes 首页原型</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 32px; }
    h1 { font-size: 24px; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #8b8b9e; }
    .preview-grid { display: flex; justify-content: center; gap: 32px; flex-wrap: wrap; }
    .phone-frame {
      width: 300px;
      height: 580px;
      background: #1a1a2e;
      border-radius: 40px;
      padding: 10px;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.25);
    }
    .phone-screen {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 30px;
      overflow: hidden;
      position: relative;
    }
    .phone-notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 24px;
      background: #1a1a2e;
      border-radius: 0 0 16px 16px;
      z-index: 100;
    }
    .screen-content {
      width: 100%;
      height: 100%;
      padding: 50px 16px 70px;
      display: flex;
      flex-direction: column;
    }
    /* 首页样式 - 紧凑型 */
    .brand-header {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 16px;
    }
    .brand-logo {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      background: linear-gradient(135deg, #1a1a2e 0%, #4a4a6a 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 16px;
      font-weight: 700;
      color: white;
    }
    .brand-info { display: flex; flex-direction: column; }
    .brand-name { font-size: 16px; font-weight: 700; color: #1a1a2e; }
    .brand-slogan { font-size: 11px; color: #8b8b9e; }
    .main-title { font-size: 22px; font-weight: 700; color: #1a1a2e; margin-bottom: 4px; display: block; }
    .sub-title { font-size: 12px; color: #8b8b9e; display: block; margin-bottom: 12px; }
    .url-input-box {
      display: flex;
      align-items: center;
      gap: 10px;
      background: #f8f9fc;
      border-radius: 12px;
      padding: 4px 4px 4px 14px;
      margin-bottom: 10px;
    }
    .input-icon { font-size: 16px; color: #a0a0b0; }
    .url-placeholder { flex: 1; font-size: 13px; color: #a0a0b0; }
    .platform-tags { display: flex; gap: 8px; margin-bottom: 12px; }
    .tag-item { display: flex; align-items: center; gap: 4px; padding: 6px 12px; background: #f8f9fc; border-radius: 16px; }
    .tag-item.bilibili { background: rgba(0,161,214,0.08); }
    .tag-item.douyin { background: rgba(254,44,85,0.08); }
    .tag-icon { font-size: 12px; font-weight: 700; color: #6b6b7e; }
    .tag-name { font-size: 11px; color: #6b6b7e; }
    .start-btn {
      position: absolute;
      left: 16px;
      right: 16px;
      bottom: 60px;
      height: 40px;
      background: linear-gradient(135deg, #7c3aed 0%, #8b5cf6 50%, #a855f7 100%);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      box-shadow: 0 4px 14px rgba(124,58,237,0.35);
      color: white;
      font-size: 14px;
      font-weight: 600;
    }
    .start-btn.disabled {
      background: linear-gradient(135deg, #d1d5db 0%, #e5e7eb 100%);
      box-shadow: none;
      opacity: 0.6;
    }
    .features-section { padding-top: 16px; border-top: 1px solid #f0f0f5; flex: 1; overflow: hidden; }
    .section-header { font-size: 14px; font-weight: 700; color: #1a1a2e; margin-bottom: 10px; }
    .features-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .feature-item { display: flex; align-items: flex-start; gap: 8px; padding: 10px; background: #f8f9fc; border-radius: 10px; }
    .feature-icon { font-size: 18px; font-weight: 700; color: #7c3aed; }
    .feature-title { font-size: 12px; font-weight: 600; color: #1a1a2e; margin-bottom: 2px; display: block; }
    .feature-desc { font-size: 10px; color: #8b8b9e; line-height: 1.3; display: block; }
    /* 设计说明 */
    .design-info { margin-top: 32px; background: white; border-radius: 16px; padding: 20px; box-shadow: 0 2px 12px rgba(0,0,0,0.04); }
    .design-info h3 { font-size: 14px; font-weight: 600; color: #7c3aed; margin-bottom: 12px; }
    .design-info p { font-size: 12px; color: #6b7280; line-height: 1.6; }
    .color-palette { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 12px; }
    .color-item { display: flex; flex-direction: column; align-items: center; gap: 4px; }
    .color-dot { width: 36px; height: 36px; border-radius: 8px; box-shadow: 0 2px 6px rgba(0,0,0,0.1); }
    .color-label { font-size: 10px; color: #6b7280; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>Omni-Notes 首页原型</h1>
      <p class="subtitle">紧凑型布局 · 一屏展示</p>
    </header>

    <div class="preview-grid">
      <div class="screenshot-item">
        <div class="phone-frame">
          <div class="phone-screen">
            <div class="phone-notch"></div>
            <div class="screen-content">
              <!-- 品牌头部 -->
              <div class="brand-header">
                <div class="brand-logo">O</div>
                <div class="brand-info">
                  <span class="brand-name">Omni-Notes</span>
                  <span class="brand-slogan">AI 视频笔记</span>
                </div>
              </div>

              <!-- 输入区域 -->
              <span class="main-title">粘贴视频链接</span>
              <span class="sub-title">AI 智能分析，一键生成笔记</span>

              <div class="url-input-box">
                <span class="input-icon">+</span>
                <span class="url-placeholder">https://www.bilibili.com/video/BV...</span>
              </div>

              <div class="platform-tags">
                <div class="tag-item bilibili">
                  <span class="tag-icon">B</span>
                  <span class="tag-name">B站</span>
                </div>
                <div class="tag-item douyin">
                  <span class="tag-icon">D</span>
                  <span class="tag-name">抖音</span>
                </div>
              </div>

              <!-- 固定底部按钮 (禁用状态：无输入时不可点击) -->
              <div class="start-btn disabled">
                <span>▶</span>
                <span>开始分析</span>
              </div>

              <!-- 功能介绍 -->
              <div class="features-section">
                <div class="section-header">能力</div>
                <div class="features-grid">
                  <div class="feature-item">
                    <span class="feature-icon">N</span>
                    <div>
                      <span class="feature-title">智能摘要</span>
                      <span class="feature-desc">快速获取核心内容</span>
                    </div>
                  </div>
                  <div class="feature-item">
                    <span class="feature-icon">S</span>
                    <div>
                      <span class="feature-title">章节速览</span>
                      <span class="feature-desc">AI 自动划分章节</span>
                    </div>
                  </div>
                  <div class="feature-item">
                    <span class="feature-icon">M</span>
                    <div>
                      <span class="feature-title">思维导图</span>
                      <span class="feature-desc">结构化呈现知识</span>
                    </div>
                  </div>
                  <div class="feature-item">
                    <span class="feature-icon">T</span>
                    <div>
                      <span class="feature-title">完整字幕</span>
                      <span class="feature-desc">自动转录视频语音</span>
                    </div>
                  </div>
                </div>
              </div>
            </div>
          </div>
        </div>
        <div style="text-align: center; margin-top: 12px; font-size: 13px; color: #6b7280;">首页 - 一屏展示</div>
      </div>
    </div>

    <!-- 设计说明 -->
    <div class="design-info">
      <h3>◈ 设计说明</h3>
      <p>紧凑型布局，所有元素在一屏内展示。品牌区、输入区、能力卡片、底部按钮均经过优化，确保在标准手机屏幕上一屏可浏览完整内容。</p>
      <div class="color-palette">
        <div class="color-item"><div class="color-dot" style="background: linear-gradient(135deg, #1a1a2e, #4a4a6a);"></div><span class="color-label">LOGO</span></div>
        <div class="color-item"><div class="color-dot" style="background: linear-gradient(135deg, #7c3aed, #a855f7);"></div><span class="color-label">主色</span></div>
        <div class="color-item"><div class="color-dot" style="background: #f8f9fc;"></div><span class="color-label">背景灰</span></div>
        <div class="color-item"><div class="color-dot" style="background: #1a1a2e;"></div><span class="color-label">标题</span></div>
        <div class="color-item"><div class="color-dot" style="background: #8b8b9e;"></div><span class="color-label">辅助</span></div>
      </div>
    </div>
  </div>
</body>
</html>
