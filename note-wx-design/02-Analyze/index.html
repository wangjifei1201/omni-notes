<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Omni-Notes 分析页原型</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f5f5f7;
      min-height: 100vh;
      padding: 40px 20px;
    }
    .container { max-width: 1200px; margin: 0 auto; }
    header { text-align: center; margin-bottom: 32px; }
    h1 { font-size: 24px; font-weight: 700; color: #1a1a2e; margin-bottom: 8px; }
    .subtitle { font-size: 14px; color: #8b8b9e; }
    .preview-grid { display: flex; justify-content: center; gap: 32px; flex-wrap: wrap; }
    .phone-frame {
      width: 300px;
      height: 580px;
      background: #1a1a2e;
      border-radius: 40px;
      padding: 10px;
      box-shadow: 0 20px 40px -12px rgba(0,0,0,0.25);
    }
    .phone-screen {
      width: 100%;
      height: 100%;
      background: #ffffff;
      border-radius: 30px;
      overflow: hidden;
      position: relative;
    }
    .phone-notch {
      position: absolute;
      top: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 100px;
      height: 24px;
      background: #1a1a2e;
      border-radius: 0 0 16px 16px;
      z-index: 100;
    }
    .screen-content {
      width: 100%;
      height: 100%;
      padding: 50px 16px 70px;
      display: flex;
      flex-direction: column;
    }
    /* 分析页样式 - 紧凑型 */
    .brand-header { display: flex; align-items: center; gap: 10px; margin-bottom: 10px; }
    .brand-logo { width: 36px; height: 36px; border-radius: 10px; background: linear-gradient(135deg, #1a1a2e 0%, #4a4a6a 100%); display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 700; color: white; }
    .brand-info { display: flex; flex-direction: column; }
    .brand-name { font-size: 16px; font-weight: 700; color: #1a1a2e; }
    .brand-slogan { font-size: 11px; color: #8b8b9e; }
    .section-title { font-size: 14px; font-weight: 600; color: #1a1a2e; margin-bottom: 8px; display: block; }
    /* 视频卡片 */
    .video-card { display: flex; gap: 10px; padding: 10px; background: #f8f9fc; border-radius: 12px; margin-bottom: 10px; }
    .video-thumb { width: 50px; height: 36px; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%); border-radius: 6px; position: relative; flex-shrink: 0; }
    .platform-badge { position: absolute; top: 2px; left: 2px; padding: 1px 3px; background: #00A1D6; border-radius: 3px; font-size: 7px; color: white; }
    .video-info { flex: 1; overflow: hidden; }
    .video-title { font-size: 12px; font-weight: 600; color: #1a1a2e; line-height: 1.3; margin-bottom: 2px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .video-meta { font-size: 10px; color: #8b8b9e; }
    /* 进度条 */
    .progress-section { margin-bottom: 10px; }
    .progress-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
    .progress-label { display: flex; align-items: center; gap: 4px; font-size: 11px; color: #6b6b7e; }
    .progress-icon { font-size: 12px; color: #7c3aed; }
    .progress-percent { font-size: 12px; font-weight: 600; color: #7c3aed; }
    .progress-bar { height: 5px; background: #e5e7eb; border-radius: 3px; overflow: hidden; }
    .progress-fill { height: 100%; background: linear-gradient(90deg, #7c3aed, #a855f7); border-radius: 3px; transition: width 0.3s; }
    .elapsed-time { font-size: 10px; color: #8b8b9e; margin-top: 4px; text-align: right; }
    /* 步骤列表 */
    .steps-section { flex: 1; }
    .step-item { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #f0f0f5; }
    .step-item:last-child { border-bottom: none; }
    .step-icon-wrap { width: 30px; height: 30px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
    .step-icon-wrap.pending { background: #f8f9fc; color: #d1d5db; }
    .step-icon-wrap.running { background: rgba(124,58,237,0.1); color: #7c3aed; }
    .step-icon-wrap.completed { background: rgba(34,197,94,0.1); color: #22c55e; }
    .step-icon { font-size: 13px; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .step-icon.spinning { animation: spin 1s linear infinite; }
    .step-info { flex: 1; }
    .step-title { font-size: 12px; font-weight: 600; color: #1a1a2e; margin-bottom: 1px; }
    .step-desc { font-size: 10px; color: #8b8b9e; }
    .step-time { font-size: 10px; color: #7c3aed; margin-left: auto; }
    .step-status { font-size: 10px; color: #8b8b9e; margin-left: auto; }
    .step-status.completed { color: #22c55e; }
    .download-progress { font-size: 9px; color: #7c3aed; margin-top: 2px; }
    /* 底部按钮 */
    .bottom-bar { position: absolute; bottom: 60px; left: 16px; right: 16px; }
    .cancel-btn { width: 100%; height: 40px; background: #f8f9fc; border-radius: 10px; font-size: 13px; font-weight: 600; color: #6b6b7e; display: flex; align-items: center; justify-content: center; gap: 6px; }
    .cancel-icon { font-size: 14px; }
    /* TabBar */
    .tab-bar { position: absolute; bottom: 0; left: 0; right: 0; height: 60px; background: #ffffff; border-top: 1px solid #f0f0f5; display: flex; }
    .tab-item { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; }
    .tab-icon { font-size: 20px; color: #8b8b9e; }
    .tab-label { font-size: 10px; color: #8b8b9e; }
    .tab-item.active .tab-icon, .tab-item.active .tab-label { color: #7c3aed; }
  </style>
</head>
<body>
  <div class="container">
    <header>
      <h1>分析页原型</h1>
      <p class="subtitle">紧凑布局 · 一屏展示</p>
    </header>

    <div class="preview-grid">
      <!-- 分析中状态 -->
      <div class="screenshot-item">
        <div class="phone-frame">
          <div class="phone-screen">
            <div class="phone-notch"></div>
            <div class="screen-content">
              <!-- 品牌头部 -->
              <div class="brand-header">
                <div class="brand-logo">O</div>
                <div class="brand-info">
                  <span class="brand-name">Omni-Notes</span>
                  <span class="brand-slogan">AI 视频笔记</span>
                </div>
              </div>

              <span class="section-title">AI 正在分析视频...</span>

              <!-- 视频信息 -->
              <div class="video-card">
                <div class="video-thumb">
                  <span class="platform-badge">B站</span>
                </div>
                <div class="video-info">
                  <div class="video-title">2024年AI发展趋势深度解析</div>
                  <div class="video-meta">综合分析</div>
                </div>
              </div>

              <!-- 进度条 -->
              <div class="progress-section">
                <div class="progress-header">
                  <div class="progress-label">
                    <span class="progress-icon">◈</span>
                    <span>分析进度</span>
                  </div>
                  <span class="progress-percent">45%</span>
                </div>
                <div class="progress-bar">
                  <div class="progress-fill" style="width: 45%;"></div>
                </div>
                <div class="elapsed-time">已耗时 00:32</div>
              </div>

              <!-- 步骤列表 -->
              <div class="steps-section">
                <div class="step-item">
                  <div class="step-icon-wrap completed"><span class="step-icon">✓</span></div>
                  <div class="step-info">
                    <div class="step-title">分析</div>
                    <div class="step-desc">提取视频信息和字幕</div>
                  </div>
                  <div class="step-status completed">已完成</div>
                </div>
                <div class="step-item">
                  <div class="step-icon-wrap running"><span class="step-icon spinning">↻</span></div>
                  <div class="step-info">
                    <div class="step-title">下载</div>
                    <div class="step-desc">下载视频音频文件</div>
                    <div class="download-progress">45% · 12.3MB</div>
                  </div>
                  <div class="step-time">00:15</div>
                </div>
                <div class="step-item">
                  <div class="step-icon-wrap pending"><span class="step-icon">◯</span></div>
                  <div class="step-info">
                    <div class="step-title">语音转义</div>
                    <div class="step-desc">Whisper 语音转文字</div>
                  </div>
                  <div class="step-status">等待</div>
                </div>
                <div class="step-item">
                  <div class="step-icon-wrap pending"><span class="step-icon">◯</span></div>
                  <div class="step-info">
                    <div class="step-title">大模型分析</div>
                    <div class="step-desc">纠错并生成摘要和观点</div>
                  </div>
                  <div class="step-status">等待</div>
                </div>
              </div>

              <!-- 底部取消按钮 -->
              <div class="bottom-bar">
                <div class="cancel-btn">
                  <span class="cancel-icon">✕</span>
                  <span>取消分析</span>
                </div>
              </div>

              <!-- TabBar -->
              <div class="tab-bar">
                <div class="tab-item active"><span class="tab-icon">◈</span><span class="tab-label">首页</span></div>
                <div class="tab-item"><span class="tab-icon">◊</span><span class="tab-label">历史</span></div>
                <div class="tab-item"><span class="tab-icon">◯</span><span class="tab-label">我的</span></div>
              </div>
            </div>
          </div>
        </div>
        <div style="text-align: center; margin-top: 12px; font-size: 13px; color: #6b7280;">分析页 - 分析中</div>
      </div>
    </div>
  </div>
</body>
</html>
